<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Animal Lifespan Quiz</title>
  <style>
    :root {
      --zissou-blue: #3B9AB2;
      --zissou-teal: #78B7C5;
      --zissou-yellow: #EBCC2A;
      --zissou-gold: #E1AF00;
      --zissou-red: #F21A00;
      --zissou-navy: #142838;
      --zissou-cream: #FBF9F2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--zissou-navy); color: var(--zissou-cream); user-select: none;
    }
    #app {
      position: relative; width: 100%; height: 100%; height: 100dvh;
      display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }
    #bg-stage {
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(circle at 50% 42%, #24485c 0%, #10202d 100%);
      overflow: hidden;
    }
    #ambient-bg {
      position: absolute; inset: -24px; width: calc(100% + 48px); height: calc(100% + 48px);
      object-fit: cover; filter: blur(22px) brightness(0.68);
      opacity: 0; transition: opacity 0.45s ease; pointer-events: none;
    }
    #ambient-bg.loaded { opacity: 1; }
    #animal-photo {
      position: relative; z-index: 1;
      width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%;
      opacity: 0; transition: opacity 0.45s ease; display: block;
    }
    #animal-photo.loaded { opacity: 1; }
    #animal-photo.contain-wide {
      object-fit: contain;
      object-position: 50% 44%;
    }
    #fallback-svg-wrap {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    #fallback-svg-wrap.visible { opacity: 0.32; }
    .top-scrim {
      position: absolute; top: 0; left: 0; right: 0; height: 30%; z-index: 2; pointer-events: none;
      background: linear-gradient(to bottom, rgba(16, 32, 45, 0.52) 0%, rgba(16, 32, 45, 0) 100%);
      transition: background 0.35s ease;
    }
    .top-scrim.light-bg {
      background: linear-gradient(to bottom, rgba(251, 249, 242, 0.66) 0%, rgba(251, 249, 242, 0) 100%);
    }
    .bottom-scrim {
      position: absolute; bottom: 0; left: 0; right: 0; height: 34%; z-index: 2; pointer-events: none;
      background: linear-gradient(to top, rgba(16, 32, 45, 0.74) 0%, rgba(16, 32, 45, 0) 100%);
    }

    /* Top Header & Session Tracker */
    header#species-header {
      position: relative; z-index: 3;
      padding: calc(env(safe-area-inset-top, 12px) + 10px) 18px 8px;
      text-align: center; transition: color 0.35s ease, text-shadow 0.35s ease;
    }
    #session-bar {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 12px; margin-bottom: 8px; border-radius: 999px;
      background: rgba(20, 40, 56, 0.72); border: 1px solid rgba(120, 183, 197, 0.42);
      color: #FBF9F2; font-size: 0.76rem; font-weight: 600;
      text-shadow: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #reset-session-btn {
      background: rgba(235, 204, 42, 0.2); border: 1px solid rgba(235, 204, 42, 0.55);
      color: var(--zissou-yellow); border-radius: 999px;
      padding: 1px 8px; font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    #reset-session-btn:active { transform: scale(0.95); }

    header#species-header.on-dark {
      color: #FBF9F2;
      text-shadow: 0 2px 12px rgba(10, 22, 32, 0.85), 0 1px 3px rgba(0, 0, 0, 0.9);
    }
    header#species-header.on-dark #latin-name { color: var(--zissou-yellow); }
    header#species-header.on-light {
      color: #10202D;
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.92), 0 0 2px rgba(255, 255, 255, 0.95);
    }
    header#species-header.on-light #latin-name { color: #1D5E70; }

    #common-name { font-size: clamp(1.6rem, 6.6vw, 2.4rem); font-weight: 800; line-height: 1.12; letter-spacing: -0.02em; }
    #subtitle-row {
      margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    }
    #latin-name { font-size: clamp(1.0rem, 4.0vw, 1.25rem); font-style: italic; font-weight: 600; letter-spacing: 0.01em; }
    #class-badge {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 999px;
      background: rgba(20, 40, 56, 0.68); color: #FBF9F2;
      border: 1px solid rgba(251, 249, 242, 0.35); text-shadow: none;
    }

    /* Center Reveal */
    #center-reveal {
      position: relative; z-index: 3; flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 0 20px; pointer-events: none;
      opacity: 0; transform: scale(0.92);
      transition: opacity 0.32s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #center-reveal.visible { opacity: 1; transform: scale(1); }
    .reveal-backdrop {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 18px 24px; border-radius: 28px; max-width: 440px;
      background: radial-gradient(ellipse at center, rgba(16, 32, 45, 0.68) 0%, rgba(16, 32, 45, 0.3) 72%, rgba(16, 32, 45, 0) 100%);
      text-align: center;
    }
    #true-age-number {
      color: #FFFFFF; font-size: clamp(4.2rem, 19vw, 7.2rem); font-weight: 900; line-height: 0.98;
      letter-spacing: -0.03em; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.78), 0 2px 6px rgba(0, 0, 0, 0.9);
    }
    #true-age-unit {
      color: #FFFFFF; font-size: clamp(1.2rem, 4.6vw, 1.6rem); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em; margin-top: 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }
    #verdict-banner {
      margin-top: 12px; padding: 6px 14px; border-radius: 999px;
      font-size: 0.92rem; font-weight: 800; letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    #verdict-banner.accurate {
      background: linear-gradient(135deg, var(--zissou-yellow) 0%, var(--zissou-gold) 100%);
      color: var(--zissou-navy);
    }
    #verdict-banner.under {
      background: linear-gradient(135deg, #F25C00 0%, var(--zissou-red) 100%);
      color: #FFFFFF;
    }
    #verdict-banner.over {
      background: linear-gradient(135deg, var(--zissou-teal) 0%, var(--zissou-blue) 100%);
      color: #FFFFFF;
    }

    #comparison-pill {
      margin-top: 8px; padding: 7px 14px; border-radius: 16px;
      background: rgba(20, 40, 56, 0.86); border: 1.5px solid var(--zissou-teal);
      color: #FBF9F2; font-size: 0.88rem; font-weight: 600; line-height: 1.35;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* Bottom Dock */
    footer#bottom-dock {
      position: relative; z-index: 4;
      padding: 10px 18px calc(env(safe-area-inset-bottom, 16px) + 14px);
      width: 100%; max-width: 480px; margin: 0 auto;
    }
    #guess-form {
      display: flex; flex-direction: column; gap: 10px;
      background: rgba(20, 40, 56, 0.8); border: 1.5px solid rgba(120, 183, 197, 0.45);
      border-radius: 22px; padding: 12px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
    }
    #guess-form.hidden { display: none; }
    .input-wrap {
      position: relative; width: 100%;
    }
    #lifespan-input {
      width: 100%; height: 54px; border-radius: 14px; border: 2px solid var(--zissou-teal);
      background: rgba(251, 249, 242, 0.97); color: var(--zissou-navy);
      font-size: 18px; font-weight: 700; text-align: center; padding: 0 56px; outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #lifespan-input::placeholder { color: #536B78; font-weight: 600; font-size: 16px; }
    #lifespan-input:focus { border-color: var(--zissou-gold); box-shadow: 0 0 0 3px rgba(225, 175, 0, 0.32); }
    .unit-tag {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      font-size: 0.82rem; font-weight: 700; color: #536B78; pointer-events: none;
    }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    .action-btn {
      width: 100%; height: 52px; border: none; border-radius: 14px;
      font-size: 1.05rem; font-weight: 800; letter-spacing: 0.02em; cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }
    .action-btn:active { transform: scale(0.98); }
    #submit-btn { background: var(--zissou-gold); color: var(--zissou-navy); }
    #next-btn { display: none; background: var(--zissou-blue); color: #FFFFFF; border: 1.5px solid rgba(255, 255, 255, 0.35); }
    #next-btn.visible { display: block; }
    #wiki-source-wrap { margin-top: 8px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #wiki-source-link {
      display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 0.75rem; font-weight: 500; color: rgba(251, 249, 242, 0.82); text-decoration: none;
      border-bottom: 1px dotted rgba(251, 249, 242, 0.45); padding-bottom: 1px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    #wiki-source-link:hover, #wiki-source-link:active { color: var(--zissou-yellow); border-bottom-color: var(--zissou-yellow); }
  </style>
</head>

  <div id="app">
    <div id="bg-stage">
      <img id="ambient-bg" alt="" aria-hidden="true" />
      <img id="animal-photo" alt="Wildlife photograph" />
      <div id="fallback-svg-wrap">
        <svg width="220" height="220" viewBox="0 0 200 200" fill="none">
          <circle cx="100" cy="100" r="82" stroke="#78B7C5" stroke-width="4" stroke-dasharray="10 8" />
          <path d="M55 112 C68 80, 128 76, 148 106 C132 132, 72 134, 55 112 Z" fill="#78B7C5" />
          <circle cx="128" cy="100" r="5" fill="#142838" />
        </svg>
      </div>
      <div id="top-scrim" class="top-scrim"></div>
      <div class="bottom-scrim"></div>
    </div>

    <header id="species-header" class="on-dark">
      <div id="session-bar">
        <span id="session-stats">Animal 1 • New Visitor</span>
        <button id="reset-session-btn" type="button" title="Reset for next visitor">Reset</button>
      </div>
      <h1 id="common-name">Loading species...</h1>
      <div id="subtitle-row">
        <span id="latin-name"></span>
        <span id="class-badge"></span>
      </div>
    </header>

    <main id="center-reveal" aria-live="polite">
      <div class="reveal-backdrop">
        <div id="true-age-number">0</div>
        <div id="true-age-unit">Years Maximum Lifespan</div>
        <div id="verdict-banner" class="accurate">Spot on!</div>
        <div id="comparison-pill">Your guess: —</div>
      </div>
    </main>

    <footer id="bottom-dock">
      <form id="guess-form" autocomplete="off">
        <div class="input-wrap">
          <input id="lifespan-input" type="number" inputmode="decimal" step="any" min="0.1" max="500" placeholder="Guess max lifespan" aria-label="Guess maximum lifespan in years" enterkeyhint="done" required />
          <span class="unit-tag">years</span>
        </div>
        <button id="submit-btn" class="action-btn" type="submit">Reveal Lifespan</button>
      </form>
      <button id="next-btn" class="action-btn" type="button">Next Animal &rarr;</button>
      <div id="wiki-source-wrap">
        <a id="wiki-source-link" href="https://commons.wikimedia.org" target="_blank" rel="noopener noreferrer">Photo credit</a>
      </div>
    </footer>
  </div>

    function refillDeck() {
      deck = [...SPECIES_DATA];
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
    }
    function drawNextSpecies() { if (deck.length === 0) refillDeck(); return deck.pop(); }
    function peekUpcoming(n = 3) {
      if (deck.length < n) refillDeck();
      return deck.slice(-n).reverse();
    }

    function buildSourceRecord(page) {
      const thumb = page?.thumbnail?.source;
      if (!thumb) return null;
      const fileName = page?.pageimage, pageTitle = page?.title;
      const sourceUrl = fileName
        ? `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(fileName)}`
        : (pageTitle ? `https://en.wikipedia.org/wiki/${encodeURIComponent(pageTitle.replace(/ /g, "_"))}` : thumb);
      return { thumb, sourceUrl, label: "Photo credit" };
    }

    async function queryCommonsFile(fileName) {
      const url = `https://commons.wikimedia.org/w/api.php?action=query&titles=${encodeURIComponent("File:" + fileName)}&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const pages = (await res.json())?.query?.pages;
      if (!pages) return null;
      for (const key of Object.keys(pages)) {
        const ii = pages[key]?.imageinfo?.[0];
        if (ii?.thumburl || ii?.url) {
          return {
            thumb: ii.thumburl || ii.url,
            sourceUrl: `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(fileName)}`,
            label: "Photo credit"
          };
        }
      }
      return null;
    }

    async function queryWikiThumb(title) {
      const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&piprop=thumbnail|name&format=json&pithumbsize=800&redirects=1&origin=*`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const pages = (await res.json())?.query?.pages;
      if (!pages) return null;
      for (const key of Object.keys(pages)) {
        const rec = buildSourceRecord(pages[key]);
        if (rec) return rec;
      }
      return null;
    }

    async function searchWikiThumb(query) {
      const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=3&prop=pageimages&piprop=thumbnail|name&format=json&pithumbsize=800&origin=*`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const pages = (await res.json())?.query?.pages;
      if (!pages) return null;
      for (const p of Object.values(pages).sort((a, b) => (a.index || 99) - (b.index || 99))) {
        const rec = buildSourceRecord(p);
        if (rec) return rec;
      }
      return null;
    }

          const rec = await queryCommonsFile(COMMONS_FILE_OVERRIDES[sp.sci]);
          if (rec) {
            imageCache.set(sp.sci, rec);
            const pre = new Image(); pre.src = rec.thumb;
            return rec;
          }
        } catch (_) {}
      }
      const candidates = [];
      if (WIKI_TITLE_OVERRIDES[sp.name]) candidates.push(WIKI_TITLE_OVERRIDES[sp.name]);
      candidates.push(sp.sci);
      if (sp.name.includes(", or ")) sp.name.split(", or ").forEach(p => candidates.push(p.trim()));
      else candidates.push(sp.name);
      for (const title of candidates) {
        try {
          const rec = await queryWikiThumb(title);
          if (rec) {
            imageCache.set(sp.sci, rec);
            const pre = new Image(); pre.src = rec.thumb;
            return rec;
          }
        } catch (_) {}
      }
      try {
        const searched = await searchWikiThumb(`${sp.sci} animal`);
        if (searched) {
          imageCache.set(sp.sci, searched);
          const pre = new Image(); pre.src = searched.thumb;
          return searched;
        }
      } catch (_) {}
      imageCache.set(sp.sci, null);
      return null;
    }

    function analyzeImageAndFrame(img, sp) {
      const [fx, fy] = FACE_FOCAL_OVERRIDES[sp.name] || CLASS_DEFAULT_FOCAL[sp.cls] || [0.42, 0.38];
      const natW = img.naturalWidth || 1;
      const natH = img.naturalHeight || 1;
      const imgAspect = natW / natH;
      const viewAspect = window.innerWidth / Math.max(1, window.innerHeight);

      const isUltraWideOnPortrait = viewAspect < 0.75 && imgAspect > 1.55;
      photoEl.classList.toggle("contain-wide", isUltraWideOnPortrait);

      if (!isUltraWideOnPortrait) {
        const posX = Math.round(Math.min(88, Math.max(12, fx * 100)));
        const posY = Math.round(Math.min(75, Math.max(15, fy * 100)));
        img.style.objectPosition = `${posX}% ${posY}%`;
      } else {
        img.style.objectPosition = "50% 44%";
      }

      // Check top luminance using a separate CORS probe so main <img> never fails to render
      const probe = new Image();
      probe.crossOrigin = "anonymous";
      probe.onload = () => {
        if (currentSpecies?.sci !== sp.sci) return;
        let isLightTop = false;
        try {
          if (!isUltraWideOnPortrait) {
            const canvas = document.createElement("canvas");
            const w = 64, h = Math.max(32, Math.round((natH / natW) * w));
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(probe, 0, 0, w, h);
            const topData = ctx.getImageData(0, 0, w, Math.max(4, Math.floor(h * 0.22))).data;
            let lumSum = 0, count = 0;
            for (let i = 0; i < topData.length; i += 4) {
              lumSum += 0.2126 * topData[i] + 0.7152 * topData[i + 1] + 0.0722 * topData[i + 2];
              count++;
            }
            isLightTop = (count > 0 ? lumSum / count : 80) > 152;
          }
        } catch (_) {}
        headerEl.classList.toggle("on-light", isLightTop);
        headerEl.classList.toggle("on-dark", !isLightTop);
        topScrimEl.classList.toggle("light-bg", isLightTop);
      };
      probe.src = img.src;
    }

    function formatYears(val) {
      return Number.isInteger(val) ? val.toString() : val.toFixed(1).replace(/\.0$/, "");
    }

    async function loadRound() {
      currentSpecies = drawNextSpecies();
      updateSessionBanner();

      centerRevealEl.classList.remove("visible");
      nextBtnEl.classList.remove("visible");
      guessFormEl.classList.remove("hidden");
      inputEl.value = "";

      commonNameEl.textContent = currentSpecies.name.split(", or ")[0];
      latinNameEl.textContent = currentSpecies.sci;
      classBadgeEl.textContent = currentSpecies.cls;

      headerEl.classList.remove("on-light");
      headerEl.classList.add("on-dark");
      topScrimEl.classList.remove("light-bg");

      ambientEl.classList.remove("loaded");
      photoEl.classList.remove("loaded", "contain-wide");
      fallbackEl.classList.remove("visible");

      const activeSci = currentSpecies.sci;
      wikiSourceLinkEl.href = `https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(activeSci)}`;
      wikiSourceLinkEl.textContent = "Photo credit";

      const imgRec = await resolveSpeciesImage(currentSpecies);
      if (currentSpecies.sci !== activeSci) return;

      if (imgRec && imgRec.thumb) {
        wikiSourceLinkEl.href = imgRec.sourceUrl;
        wikiSourceLinkEl.textContent = "Photo credit";
        ambientEl.src = imgRec.thumb;
        photoEl.onload = () => {
          if (currentSpecies.sci !== activeSci) return;
          analyzeImageAndFrame(photoEl, currentSpecies);
          ambientEl.classList.add("loaded");
          photoEl.classList.add("loaded");
        };
        photoEl.onerror = () => fallbackEl.classList.add("visible");
        photoEl.src = imgRec.thumb;
      } else {
        fallbackEl.classList.add("visible");
      }

      // Preload next 3 species in background for instant transitions on conference Wi-Fi
      peekUpcoming(3).forEach(sp => resolveSpeciesImage(sp));
    }

    guessFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const raw = parseFloat(inputEl.value);
      if (isNaN(raw) || raw <= 0) { inputEl.focus(); return; }
      inputEl.blur();

      const actual = currentSpecies.act;
      const pubEst = currentSpecies.est;
      const userRatio = raw / actual;
      const pubRatio = pubEst / actual;

      sessionRounds += 1;
      sessionLogErrors.push(Math.abs(Math.log(userRatio)));
      updateSessionBanner();

      trueAgeNumberEl.textContent = formatYears(actual);
      trueAgeUnitEl.textContent = actual === 1 ? "Year Maximum Lifespan" : "Years Maximum Lifespan";

      verdictBannerEl.classList.remove("accurate", "under", "over");
      if (userRatio >= 0.8 && userRatio <= 1.2) {
        verdictBannerEl.classList.add("accurate");
        verdictBannerEl.textContent = `Spot on! (${userRatio.toFixed(2)}× actual lifespan)`;
      } else if (userRatio < 0.8) {
        verdictBannerEl.classList.add("under");
        const factor = (actual / raw).toFixed(1).replace(/\.0$/, "");
        verdictBannerEl.textContent = `Underestimated — lives ${factor}× longer (${userRatio.toFixed(2)}×)`;
      } else {
        verdictBannerEl.classList.add("over");
        verdictBannerEl.textContent = `Overestimated — ${userRatio.toFixed(2)}× actual lifespan`;
      }

      comparisonPillEl.innerHTML = `Your guess: <strong>${formatYears(raw)} yrs</strong> (${userRatio.toFixed(2)}×) &bull; Survey avg: <strong>${formatYears(pubEst)} yrs</strong> (${pubRatio.toFixed(2)}×)`;

      guessFormEl.classList.add("hidden");
      centerRevealEl.classList.add("visible");
      nextBtnEl.classList.add("visible");
    });

    nextBtnEl.addEventListener("click", () => loadRound());
    loadRound();
  </script>
</body>
</html>
